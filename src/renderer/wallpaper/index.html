<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src wallpaper: data:; media-src wallpaper:; frame-src wallpaper:"
    />
    <title>LiveDesk Wallpaper</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: default; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 600ms ease; }
      .layer.visible { opacity: 1; }
      video.layer, img.layer { object-position: center; }
      .fit-cover { object-fit: cover; }
      .fit-contain { object-fit: contain; }
      .fit-fill { object-fit: fill; }
      .fit-center { object-fit: none; }
      iframe.layer { background: #000; }
    </style>
  </head>
  <body>
    <script src="wallpaper.js"></script>
  </body>
</html>
